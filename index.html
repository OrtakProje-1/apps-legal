# index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>App Legal & Policies</title>
  <meta
    name="description"
    content="Privacy policies, terms of use, and legal information for our applications."
  />

  <style>
    :root {
      color-scheme: dark;
      --background: #0f1117;
      --surface: #171a22;
      --surface-hover: #1d212b;
      --border: #2a2f3a;
      --text: #f5f7fa;
      --text-secondary: #9ca3af;
      --accent: #7c5cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: 80px 0;
    }

    header {
      margin-bottom: 48px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 12px;
    }

    header p {
      max-width: 620px;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .app-card {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .app-card:hover {
      transform: translateY(-3px);
      background: var(--surface-hover);
    }

    .app-name {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .app-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .links a:hover {
      background: rgba(124, 92, 255, 0.12);
      border-color: var(--accent);
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--text-secondary);
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>App Legal & Policies</h1>

      <p>
        Privacy policies, terms of use, and other legal information
        for our applications.
      </p>
    </header>

    <section class="apps">

      <article class="app-card">
        <div class="app-name">Valorant Crosshair Pro</div>

        <p class="app-description">
          Legal documents and privacy information for Valorant Crosshair Pro.
        </p>

        <div class="links">
          <a href="./crosshair/privacy-policy.html">
            Privacy Policy
          </a>

          <a href="./crosshair/terms-of-use.html">
            Terms of Use
          </a>
        </div>
      </article>

      <!-- Add future applications here -->

      <!--

        <div class="app-name">App Name</div>

        <p class="app-description">
          Legal documents for App Name.
        </p>

        <div class="links">
          <a href="./app-name/privacy-policy.html">
            Privacy Policy
          </a>

          <a href="./app-name/terms-of-use.html">
            Terms of Use
          </a>
        </div>
      </article>
      -->

    </section>

    <footer>
      © 2026 All rights reserved.
    </footer>
  </main>
</body>
</html>
